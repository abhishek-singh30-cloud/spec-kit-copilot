name: Deploy Canary

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Spec Kit
        run: |
          python -m pip install --upgrade pip
          pip install specify-cli

      - name: Initialize Spec Kit
        run: |
          specify init . --integration copilot --force

      - name: Show Spec Kit help
        run: |
          specify --help
          specify integration --help
          specify workflow --help

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Spec Kit workflow or integration step
        run: |
          echo "Replace this with the correct Spec Kit command discovered from help output"

      - name: Terraform Init
        working-directory: envs/canary/generated
        run: terraform init

      - name: Terraform Plan
        working-directory: envs/canary/generated
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: envs/canary/generated
        run: terraform apply -auto-approve tfplan
