name: Deploy Canary

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Terraform from spec
        run: |
          mkdir -p envs/canary/generated
          python scripts/generate_from_spec.py \
            --spec specs/canary/infra-spec.md \
            --output envs/canary/generated

      - name: Show generated files
        run: |
          find envs/canary/generated -maxdepth 2 -type f | sort

      - name: Terraform Init
        working-directory: envs/canary/generated
        run: terraform init

      - name: Terraform Plan
        working-directory: envs/canary/generated
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: envs/canary/generated
        run: terraform apply -auto-approve tfplan
